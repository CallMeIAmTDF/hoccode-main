server:
  port: 8080

spring:
  application:
    name: template
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/hoccode?createDatabaseIfNotExist=true&useSSL=false}"
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 5
redis:
  host: ${REDIS_HOST:localhost}
  port: 6379


auth:
  jwt:
    accessSignerKey: ${JWT_ACCESS_KEY:dev-access-key}
    refreshSignerKey: ${JWT_REFRESH_KEY:dev-refresh-key}
    valid-duration: 86400
    refreshable-duration: 2592000
  outbound:
    identity:
      client-id: "391255146342-mdm2kqf4afvr3je7850ku08qp2d6fcon.apps.googleusercontent.com"
      client-secret: ${OUTBOUND_SECRET:fakedata}
      redirect-uri: "${OUTBOUND_REDIRECT_URI:http://localhost:3000/auth/authenticate}"
  verify:
    register-code-duration: 86400000 # 24 * 60 * 60 * 1000 = 86400000
    forgot-password-code-duration: 86400000

code-runner-api:
  protocol: ${CODE_RUNNER_API_PROTOCOL:http}
  host: ${CODE_RUNNER_API_HOST:localhost}
  port: ${CODE_RUNNER_API_PORT:1337}

gpt-api:
  protocol: ${GPT_API_PROTOCOL:http}
  host: ${GPT_API_HOST:localhost}
  port: ${GPT_API_PORT:8000}

plagiarism-api:
  protocol: ${PLAGIARISM_API_PROTOCOL:http}
  host: ${PLAGIARISM_API_HOST:localhost}
  port: ${PLAGIARISM_API_PORT:8000}

mailServer:
  host: smtp.sendgrid.net
  port: 2525
  email: apikey
  password: ${MAIL_PASSWORD:fakedata}
  isSSL: false

api:
  base-url: ${FRONTEND_URL:http://localhost:3000}
  path:
    verify-register: "/auth/verify?code="
    verify-forgot-password: "/auth/forgot?code="
    notice-contest: "/contest/"
    noti-streak: "/learn"
    noti-plagiarism: "/profile/contest/"
    payos: "/payment"

app:
  rate-limit:
    enforced-endpoints:
      - method: POST
        path: /submission
        limit-key: submission-post-limit
      - method: POST
        path: /chat
        limit-key: chat-post-limit
      - method: GET
        path: /test
        limit-key: test
  pdf:
    directory: "./storage/pdf_report/"

pay-os:
  client-id: ${PAYOS_CLIENT_ID:fakedata}
  api-key: ${PAYOS_KEY:fakedata}
  checksum-key: ${PAYOS_CHECK_SUM_KEY:fakedata}
